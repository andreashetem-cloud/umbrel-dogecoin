  <!--
    A plain silver coin with a stylised Ł: the stem leans, the foot squares off
    at the bottom right and one diagonal bar crosses the stem. Drawn from
    scratch rather than traced from the Litecoin Foundation's mark, which is a
    trademark and not ours to ship.
  -->
