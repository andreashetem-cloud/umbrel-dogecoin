manifestVersion: 1
id: doge-dogecoin-solo
category: bitcoin
name: Dogecoin Solo Mining
version: "1.0.0"
tagline: Point your scrypt miners at your own Dogecoin node
description: >-
  A stratum server that turns your Dogecoin node into a solo mining pool of one.


  BEFORE YOU INSTALL: set PAYOUT_ADDRESS in this app's docker-compose.yml to a Dogecoin address you
  control. The app deliberately refuses to mine without one, so that it can never build a block whose
  reward nobody can spend. Set it in the app store repository rather than on the device — an edit to
  the running copy is replaced the next time the app updates.


  Your miners connect to this app instead of to somebody else's pool. Every block template comes from
  your own node, every candidate block is submitted by your own node, and the reward pays straight to
  an address you control. There is no pool operator, no fee, and no account.


  Because there is no pool, there is also no payout system to trust or corrupt: the coinbase of the
  block IS the payout. Put a Dogecoin address in your miner's username field and any block that worker
  finds pays that address directly. Leave it blank and the app's configured address is used.


  The dashboard shows per-worker hashrate, share difficulty, your best share so far as a percentage of
  network difficulty, and the expected time to a block at your current hashrate. Per-worker variable
  difficulty means a 10 MH/s device and a 500 MH/s device can share the same server without one
  drowning out the other.


  Be clear-eyed about the odds. Solo mining is a lottery: with a few hundred MH/s against a multi-
  petahash network you should expect years between blocks, and when you do win, you win the whole
  block. The dashboard shows your real expected time so you can decide for yourself. Much lottery.
  Very patience.
developer: Andreas
website: https://github.com/andreashetem-cloud/umbrel-dogecoin
dependencies:
  - doge-dogecoin-node
repo: https://github.com/andreashetem-cloud/umbrel-dogecoin
support: https://github.com/andreashetem-cloud/umbrel-dogecoin/issues
port: 22551
icon: https://raw.githubusercontent.com/andreashetem-cloud/umbrel-dogecoin/main/doge-dogecoin-solo/icon.svg
