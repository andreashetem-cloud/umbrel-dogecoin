version: "3.7"

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app_proxy:
    environment:
      APP_HOST: doge-dogecoin-solo_app_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "true"

  app:
    image: ghcr.io/andreashetem-cloud/umbrel-dogecoin-stratum:1.3.1
    restart: on-failure
    logging: *default-logging
    # Docker's default is 10 seconds, and the shutdown handler waits up to 130
    # for a block that is still being submitted — including its retry schedule.
    # Without this the app is SIGKILLed mid-submit on every app update, which is
    # exactly the case that drain() was written to survive.
    stop_grace_period: 5m
    volumes:
      # Statistics that survive a restart: shares, best share ever, hashrate
      # history, blocks found. Without this the dashboard can only ever describe
      # the time since the last update, which for a multi-year lottery is the
      # least interesting window there is.
      - ${APP_DATA_DIR}/data:/data
    ports:
      # Stratum. Reachable from your LAN so miners can connect. Do NOT forward
      # this on your router — anyone who reaches it can mine to their own
      # address using your node's block templates.
      - "22557:22557"
    environment:
      PORT: "3000"
      STRATUM_PORT: "22557"
      # Where the durable statistics live. Set to an empty string to disable.
      STATS_PATH: "/data/stats.json"

      # The Dogecoin node app. Full container name rather than the bare service
      # name: every Umbrel app shares one docker network, so service aliases can
      # collide across apps.
      RPC_HOST: doge-dogecoin-node_dogecoind_1
      RPC_PORT: "22555"
      # umbrelOS sources exports.sh from an app's declared dependencies — not
      # from every installed app — before rendering this file. These variables
      # resolve only because umbrel-app.yml lists doge-dogecoin-node under
      # `dependencies`. Remove that line and the password silently becomes an
      # empty string, and the app retries against a 401 forever.
      RPC_USER: ${APP_DOGECOIN_NODE_RPC_USER:-umbrel}
      RPC_PASSWORD: ${APP_DOGECOIN_NODE_RPC_PASS:-}

      # ------------------------------------------------------------------
      # REQUIRED: the Dogecoin address that block rewards are paid to.
      # A worker may override this by putting its own address in the stratum
      # username field. Get this wrong and a found block pays a stranger, so
      # the app refuses to start until it is set and passes checksum validation.
      #
      # Set it in ~/umbrel/app-data/doge-dogecoin-solo/.env on the device:
      #
      #     PAYOUT_ADDRESS=D...
      #
      # An address written here instead is wiped by the next app update, and
      # the app then refuses to start — which is the safe failure, but a
      # failure all the same. See the long note further down about `.env`.
      # ------------------------------------------------------------------
      PAYOUT_ADDRESS: "${PAYOUT_ADDRESS:-}"

      # --- share difficulty ---------------------------------------------
      # Stratum difficulty for scrypt: one share costs D * 2^16 hashes, NOT
      # D * 2^32 as on Bitcoin. Every scrypt miner applies that 2^16 factor
      # (cgminer: `if (opt_scrypt) d64 *= 65536`), so the numbers here look
      # large compared to a Bitcoin pool and that is correct.
      #
      # Vardiff tunes each worker individually; these are only the bounds.
      #
      # The bounds themselves come from MINING_PROFILE at the bottom of this
      # file and are deliberately NOT set here: a value written out explicitly
      # wins over the profile, so setting them would make switching to the
      # rented profile do nothing at all. The home values are, for reference:
      #
      #   START_DIFFICULTY 2048   an 11 MH/s device at ~1 share every 12s
      #   MIN_DIFFICULTY   64
      #   MAX_DIFFICULTY   4194304
      #
      # Uncomment one only if you want it fixed regardless of profile.
      TARGET_SHARE_SECONDS: "12"
      VARDIFF_WINDOW: "10"

      # --- timing --------------------------------------------------------
      # New blocks arrive via getblocktemplate longpoll within milliseconds;
      # this poll is only a safety net if longpoll is interrupted.
      POLL_INTERVAL_SECONDS: "5"
      JOB_REBUILD_SECONDS: "30"
      HASHRATE_WINDOW_SECONDS: "600"

      COINBASE_TAG: "/umbrel-doge-solo/"

      # --- limits --------------------------------------------------------
      # Stratum has no authentication — there is no account to authenticate
      # against — so anything unbounded is a denial-of-service path for anyone
      # who can reach port 22557.
      #
      # These ceilings also come from MINING_PROFILE, for the same reason as the
      # difficulty bounds above. The home values are:
      #
      #   MAX_CONNECTIONS          64
      #   MAX_CONNECTIONS_PER_IP    8   one machine opening silent sockets must
      #                                 not be able to take every slot
      #   MAX_MESSAGES_PER_10S    300
      #   MAX_PAYOUT_VARIANTS      16
      #   DIFFICULTY_GRACE_SECONDS 60   work handed out just before a difficulty
      #                                 raise is still accepted this long, or
      #                                 every raise looks like failing hardware
      #   SOCKET_TIMEOUT_SECONDS  900
      #   PING_INTERVAL_SECONDS    60
      #
      # Seconds a connection may sit without authorizing before it is dropped.
      # Not profile-dependent: a handshake takes milliseconds either way.
      HANDSHAKE_TIMEOUT_SECONDS: "30"

      # Ignore the address in a worker's username and pay EVERY block to
      # PAYOUT_ADDRESS.
      #
      # On by default, and it should stay on unless you specifically want
      # different miners paying different addresses. Stratum has no
      # authentication: with this off, anyone who can reach port 22557 mines
      # with your node's templates and puts their OWN address in the username,
      # so the block your electricity found pays them. That is not theoretical
      # — it was demonstrated against this app during review.
      LOCK_PAYOUT_ADDRESS: "1"

      # ---------------------------------------------------------------------
      # Which kind of miner is pointed at this pool.
      #
      #   home    your own hardware on your own network. The default.
      #   rented  a NiceHash-style order arriving over the internet.
      #
      # This is ONE setting rather than a dozen, because a rented order is three
      # to four orders of magnitude faster than a home miner and every limit
      # sized for a stranger becomes the thing that refuses the hashpower you
      # paid for. At the home settings a 100 GH/s order opens by submitting
      # roughly 750 shares a second, trips the flood limit and is disconnected
      # before vardiff can react — the order shows as failing and the money is
      # spent anyway. The rented profile raises the starting difficulty, the
      # message ceiling, the connection caps, the socket timeout and the
      # difficulty grace together. Anything you set explicitly here still wins.
      #
      # The app REFUSES to start with rented + LOCK_PAYOUT_ADDRESS off. Renting
      # means the port is open to the internet, and on an open port an unlocked
      # payout hands your block to whoever asks for it.
      #
      # Still true with everything set correctly: stratum has no accounts, so
      # anyone reaching the port can authorize under one of your worker names
      # and inflate its counters — the statistics become untrustworthy, though
      # with the payout locked no money moves. And connection slots are finite.
      # Both are reasons to firewall the port to the addresses you actually see
      # in the log, and to un-forward it the moment the order ends.
      #
      # Worth knowing before you spend anything: rented scrypt hashpower is
      # priced off DOGE *and* Litecoin revenue combined, because everyone else
      # merge-mines both on the same hashes. Pointing it at a DOGE-only node
      # throws that half away, so the expected return is roughly 25% below what
      # you pay. It buys a real end-to-end test and a lottery ticket, not profit.
      # ---------------------------------------------------------------------
      # Also read from .env, so switching to a rented order for a day and back
      # again does not mean editing a file the next update overwrites:
      #     MINING_PROFILE=rented
      MINING_PROFILE: "${MINING_PROFILE:-home}"

      # ---------------------------------------------------------------------
      # Merged mining: Dogecoin AND Litecoin from the same hashes.
      #
      # Off by default. Switched on, your miners stop hashing Dogecoin headers
      # and start hashing LITECOIN headers that carry a commitment to a Dogecoin
      # block — which is how Dogecoin has been mined since 2014. A share that
      # meets Litecoin's target becomes a Litecoin block; one that meets
      # Dogecoin's becomes a Dogecoin block; neither costs the other anything.
      # It is also why rented scrypt hashpower is priced off both chains at
      # once: mining only Dogecoin throws half the value of every hash away.
      #
      # Requirements:
      #   1. The Litecoin Node app, installed and fully synced. A pruned node is
      #      fine — mining needs the UTXO set, not old blocks.
      #   2. LTC_PAYOUT_ADDRESS: a Litecoin address you control. Legacy (L…) or
      #      P2SH (M… / 3…). A bech32 ltc1… address is NOT supported here and
      #      the app will refuse to start rather than mine to a script it cannot
      #      build. Get one from the Litecoin app, or from any wallet you own.
      #   3. The Litecoin node's RPC password. It is derived per device, so it
      #      is not in this file. Read it out once with:
      #
      #        sudo docker exec doge-litecoin-node_litecoind_1 \
      #          sh -c 'echo $RPC_PASSWORD'
      #
      #      and paste it below. Treat it like a password, because it is one.
      #
      # Nothing about the Dogecoin-only path changes while this is off.
      #
      # ---------------------------------------------------------------------
      # WHERE TO PUT THESE VALUES
      #
      # Not here. Every setting below is read from a file called `.env` in the
      # app's data directory on the device:
      #
      #     ~/umbrel/app-data/doge-dogecoin-solo/.env
      #
      # umbrelOS regenerates THIS file from the app store on every install and
      # every update, so anything typed here is lost the next time the app
      # updates — silently, with merged mining simply off again the next
      # morning. It does not create or touch `.env`, so settings there survive.
      # That file is also the right place for the Litecoin RPC password, which
      # has no business being in a git repository.
      #
      # Create it once (600, root-owned):
      #
      #     MERGED_MINING=1
      #     LTC_PAYOUT_ADDRESS=L...            your Litecoin address (L/M/3)
      #     LTC_RPC_PASSWORD=...               from the Litecoin Node app
      #
      # Anything left out keeps the default after the :- below, which is the
      # Dogecoin-only behaviour.
      # ---------------------------------------------------------------------
      MERGED_MINING: "${MERGED_MINING:-0}"
      LTC_RPC_HOST: "${LTC_RPC_HOST:-doge-litecoin-node_litecoind_1}"
      LTC_RPC_PORT: "${LTC_RPC_PORT:-9332}"
      LTC_RPC_USER: "${LTC_RPC_USER:-umbrel}"
      LTC_RPC_PASSWORD: "${LTC_RPC_PASSWORD:-}"
      LTC_PAYOUT_ADDRESS: "${LTC_PAYOUT_ADDRESS:-}"
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # The minimum for the startup chown and the privilege drop, and nothing
      # more. FOWNER and DAC_OVERRIDE are deliberately absent: nothing in the
      # entrypoint needs them, and PID 1 stays root for the container's life.
      - CHOWN
      - SETUID
      - SETGID
