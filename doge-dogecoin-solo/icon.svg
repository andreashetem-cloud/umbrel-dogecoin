<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Dogecoin solo mining">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#221c14"/>
      <stop offset="100%" stop-color="#0f0d0a"/>
    </linearGradient>
    <radialGradient id="coin" cx="34%" cy="26%" r="82%">
      <stop offset="0%" stop-color="#f0d46a"/>
      <stop offset="52%" stop-color="#c2a633"/>
      <stop offset="100%" stop-color="#8a7726"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8e2d4"/>
      <stop offset="55%" stop-color="#9d968a"/>
      <stop offset="100%" stop-color="#6a6459"/>
    </linearGradient>
    <linearGradient id="haft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a6a3f"/>
      <stop offset="100%" stop-color="#5a4427"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- The pickaxe sits behind the coin: the tool, then what it is for. -->
  <g transform="rotate(-32 128 128)">
    <rect x="121" y="52" width="14" height="152" rx="7" fill="url(#haft)"/>
    <path d="M52 74 C88 50 168 50 204 74 C168 66 88 66 52 74 Z" fill="url(#steel)"/>
    <path d="M52 74 C88 50 168 50 204 74 L198 80 C166 60 90 60 58 80 Z" fill="#000" opacity="0.18"/>
  </g>

  <circle cx="128" cy="140" r="62" fill="#0f0d0a" opacity="0.55"/>
  <circle cx="128" cy="136" r="60" fill="url(#coin)"/>
  <circle cx="128" cy="136" r="60" fill="none" stroke="#6f5f1e" stroke-width="3"/>
  <circle cx="128" cy="136" r="51" fill="none" stroke="#f4e6a8" stroke-width="2" opacity="0.35"/>

  <!-- Dogecoin's D with its crossbar -->
  <g fill="#2a2208">
    <path d="M104 104 h27 c22 0 36 13 36 32 s-14 32-36 32 h-27 v-19 h25 c11 0 17-5 17-13 s-6-13-17-13 h-25 z"/>
    <rect x="92" y="127" width="52" height="17" rx="3"/>
  </g>
</svg>
