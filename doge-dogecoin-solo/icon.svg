<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Dogecoin and Litecoin solo mining">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#221c14"/>
      <stop offset="100%" stop-color="#0f0d0a"/>
    </linearGradient>
    <radialGradient id="coin" cx="34%" cy="26%" r="82%">
      <stop offset="0%" stop-color="#f0d46a"/>
      <stop offset="52%" stop-color="#c2a633"/>
      <stop offset="100%" stop-color="#8a7726"/>
    </radialGradient>
    <!-- Litecoin's own silver, kept clearly cooler than the gold so the two
         coins are told apart at 32 pixels, where the glyphs are a smudge. -->
    <radialGradient id="silver" cx="34%" cy="26%" r="82%">
      <stop offset="0%" stop-color="#e9edf2"/>
      <stop offset="52%" stop-color="#a6b0bd"/>
      <stop offset="100%" stop-color="#6d7683"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8e2d4"/>
      <stop offset="55%" stop-color="#9d968a"/>
      <stop offset="100%" stop-color="#6a6459"/>
    </linearGradient>
    <linearGradient id="haft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a6a3f"/>
      <stop offset="100%" stop-color="#5a4427"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- The pickaxe sits behind the coins: the tool, then what it is for. Higher
       than it was, because there are two coins under it now. -->
  <g transform="rotate(-32 128 112)">
    <rect x="121" y="34" width="13" height="140" rx="6" fill="url(#haft)"/>
    <path d="M56 58 C90 36 166 36 200 58 C166 50 90 50 56 58 Z" fill="url(#steel)"/>
    <path d="M56 58 C90 36 166 36 200 58 L194 64 C164 46 92 46 62 64 Z" fill="#000" opacity="0.18"/>
  </g>

  <!-- Litecoin behind, Dogecoin in front. This is a Dogecoin app that can also
       mine Litecoin, and the icon says so in that order. -->
  <g>
    <circle cx="84" cy="156" r="45" fill="#0f0d0a" opacity="0.55"/>
    <circle cx="84" cy="152" r="43" fill="url(#silver)"/>
    <circle cx="84" cy="152" r="43" fill="none" stroke="#5b6470" stroke-width="3"/>
    <circle cx="84" cy="152" r="35" fill="none" stroke="#f2f5f8" stroke-width="2" opacity="0.35"/>
    <!-- Litecoin's Ł: a slanted stem, a foot, and the bar across it. Drawn as
         geometry rather than set in a font, because an icon that depends on a
         font renders differently on every machine that rasterises it — and
         kept clear of the coin in front, so the foot is not swallowed. -->
    <g fill="#232a33">
      <path d="M78 128 H97 L88 162 H112 L108 176 H66 Z"/>
      <path d="M60 146 H102 L98 159 H56 Z"/>
    </g>
  </g>

  <g>
    <circle cx="172" cy="154" r="50" fill="#0f0d0a" opacity="0.65"/>
    <circle cx="172" cy="150" r="48" fill="url(#coin)"/>
    <circle cx="172" cy="150" r="48" fill="none" stroke="#6f5f1e" stroke-width="3"/>
    <circle cx="172" cy="150" r="40" fill="none" stroke="#f4e6a8" stroke-width="2" opacity="0.35"/>
    <!-- Dogecoin's Ð with its crossbar -->
    <g fill="#2a2208">
      <path d="M154 125 h21 c17.5 0 28.6 10.4 28.6 25.4 s-11.1 25.4-28.6 25.4 h-21 v-15.1 h19.9 c8.8 0 13.6-4 13.6-10.3 s-4.8-10.3-13.6-10.3 h-19.9 z"/>
      <rect x="145" y="143.5" width="41" height="13.5" rx="2.5"/>
    </g>
  </g>
</svg>
